<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gene Pool Revision</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>body{margin:0}
/* Layout: one centred column; mode tabs + topic chips on top, one big play area below. Motif: the four DNA bases. */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --ink:#16201B; --muted:#5C6A62; --line:#D5DDD7;
  --accent:#1F6B4A; --accent-ink:#FFFFFF; --good:#1F7A4A; --bad:#B2373F; --goodbg:#E2F2E8; --badbg:#F8E4E5;
  --A:#2E7D4F; --T:#B8661A; --C:#2F5D9E; --G:#B23A48;
  --dna:#2E7D4F; --inh:#2F5D9E; --rep:#B8661A; --pop:#B23A48; --trk:#6B4C9A;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1613; --surface:#18221D; --ink:#E8EEEA; --muted:#9AA9A0; --line:#2C3A33;
  --accent:#6CC79A; --accent-ink:#0F1613; --good:#6CC79A; --bad:#F08A90; --goodbg:#183326; --badbg:#3A1C1F;
  --A:#6CC79A; --T:#F0A25A; --C:#86A9E8; --G:#F08A90;
  --dna:#6CC79A; --inh:#86A9E8; --rep:#F0A25A; --pop:#F08A90; --trk:#B79BE6; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#18221D; --ink:#E8EEEA; --muted:#9AA9A0; --line:#2C3A33;
  --accent:#6CC79A; --accent-ink:#0F1613; --good:#6CC79A; --bad:#F08A90; --goodbg:#183326; --badbg:#3A1C1F;
  --A:#6CC79A; --T:#F0A25A; --C:#86A9E8; --G:#F08A90;
  --dna:#6CC79A; --inh:#86A9E8; --rep:#F0A25A; --pop:#F08A90; --trk:#B79BE6; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;font-size:15px}
.bases{display:flex;gap:4px}
.bases span{font-family:var(--display);font-weight:800;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:15px}
.bases .a{background:var(--A)}.bases .t{background:var(--T)}.bases .c{background:var(--C)}.bases .g{background:var(--G)}
:root[data-theme="dark"] .bases span{color:#0F1613}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bases span{color:#0F1613}}
nav.modes{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px;width:fit-content;max-width:100%;flex-wrap:wrap}
nav.modes button{font:700 16px var(--body);border:0;background:transparent;color:var(--ink);padding:9px 18px;border-radius:999px;cursor:pointer}
nav.modes button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.topics{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.topics .lbl{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:4px}
.chip{font:700 14px var(--body);border:2px solid var(--tc,var(--line));background:transparent;color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--tc,var(--accent));color:var(--bg);border-color:var(--tc,var(--accent))}
button:focus-visible,.flipcard:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.muted{color:var(--muted)}
.btn{font:700 16px var(--body);border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 18px;border-radius:12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{border-color:var(--good);color:var(--good)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.tag{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--tc);}
/* flip */
.flipcard{perspective:1200px;cursor:pointer;border:0;background:none;padding:0;width:100%;text-align:left;color:inherit;font:inherit}
.flipinner{position:relative;min-height:300px;transition:transform .5s;transform-style:preserve-3d}
.flipcard.on .flipinner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:var(--r);border:2px solid var(--tc);background:var(--surface);backface-visibility:hidden;display:flex;flex-direction:column;padding:22px;gap:10px}
.face.back{transform:rotateY(180deg);background:color-mix(in srgb,var(--tc) 9%,var(--surface))}
.face .big{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,46px);line-height:1.08;color:var(--tc);text-wrap:balance}
.face .def{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;font-size:clamp(19px,3vw,23px);line-height:1.4}
.face .ex{font-style:italic;color:var(--muted);font-size:17px}
.face .hint{text-align:center;color:var(--muted);font-size:14px}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
/* quiz */
.qdef{font-size:clamp(20px,3.2vw,25px);line-height:1.4;font-weight:700}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.options{grid-template-columns:1fr}}
.opt{font:700 18px var(--body);text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:14px 16px;border-radius:12px;cursor:pointer;min-width:0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.strand{display:flex;gap:5px;flex-wrap:wrap}
.strand span{width:26px;height:26px;border-radius:7px;border:2px dashed var(--line);display:grid;place-items:center;font:800 13px var(--display);color:var(--bg)}
.strand span.ok{border:0}
.strand span.no{border:2px solid var(--bad);color:var(--bad);background:transparent}
.feedback{font-weight:700;min-height:1.4em}
.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
/* match */
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:10px}
@media (max-width:560px){.mgrid{grid-template-columns:1fr}}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.tile{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 13px;cursor:pointer;min-height:54px}
.tile.term{font-family:var(--display);font-weight:700;font-size:19px}
.tile.def{font-size:16px;line-height:1.35}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.tile.done{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,var(--surface));cursor:default;opacity:.75}
.tile.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.stat{font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.done-box{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.missed{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.missed li{border-left:4px solid var(--tc);padding:4px 10px;background:color-mix(in srgb,var(--tc) 8%,var(--surface));border-radius:0 8px 8px 0}
@media (prefers-reduced-motion: reduce){.flipinner{transition:none}.tile.shake{animation:none}.progress i{transition:none}}
</style></head><body>

<div class="wrap">
  <header>
    <div>
      <h1>Gene Pool Revision</h1>
      <p class="sub">Year 11 genetics (92022) · learn the definitions that earn Achieved</p>
    </div>
    <div class="bases" aria-hidden="true"><span class="a">A</span><span class="t">T</span><span class="c">C</span><span class="g">G</span></div>
  </header>

  <nav class="modes" role="tablist" aria-label="Game mode">
    <button role="tab" id="tab-flip" aria-selected="true" data-mode="flip">Flash cards</button>
    <button role="tab" id="tab-quiz" aria-selected="false" data-mode="quiz">Quiz</button>
    <button role="tab" id="tab-match" aria-selected="false" data-mode="match">Match up</button>
  </nav>

  <div class="topics" id="topics"><span class="lbl">Topics</span></div>

  <section class="panel" id="panel"></section>
</div>

<script>
const DATA = {"topics": [{"id": "dna", "name": "DNA & cells"}, {"id": "inh", "name": "Inheritance"}, {"id": "rep", "name": "Reproduction & meiosis"}, {"id": "pop", "name": "Variation & populations"}, {"id": "trk", "name": "Gene tracking"}], "cards": [{"topic": "dna", "term": "Nucleus", "def": "The part of the cell that contains the chromosomes (DNA) and controls the cell.", "ex": ""}, {"topic": "dna", "term": "Chromosome", "def": "A long, tightly coiled strand of DNA found in the nucleus. Chromosomes come in pairs, one from each parent.", "ex": "Humans have 46 (23 pairs)."}, {"topic": "dna", "term": "DNA", "def": "The double-helix molecule that carries the genetic code: the instructions for making proteins.", "ex": "Made of the bases A, T, C and G."}, {"topic": "dna", "term": "Gene", "def": "A section of DNA on a chromosome that codes for a protein, which produces a trait.", "ex": "The gene for eye colour."}, {"topic": "dna", "term": "Allele", "def": "A different version of the same gene.", "ex": "B (brown eyes) or b (blue eyes)."}, {"topic": "dna", "term": "Nucleotide", "def": "The building block of DNA: one sugar + one phosphate + one base.", "ex": ""}, {"topic": "dna", "term": "Base", "def": "The four “letters” of DNA: A, T, C and G.", "ex": "A pairs with T, C pairs with G."}, {"topic": "dna", "term": "Complementary base pairing", "def": "A always pairs with T, and C always pairs with G. This holds the two DNA strands together.", "ex": ""}, {"topic": "dna", "term": "Sugar-phosphate backbone", "def": "The two “sides of the ladder” of DNA, made of alternating sugar and phosphate.", "ex": ""}, {"topic": "dna", "term": "Double helix", "def": "The shape of DNA: two strands twisted together like a spiral ladder.", "ex": ""}, {"topic": "dna", "term": "Triplet (codon)", "def": "A sequence of three bases that codes for one amino acid.", "ex": "e.g. ATG"}, {"topic": "dna", "term": "Genetic code", "def": "The order (sequence) of bases in DNA. It gives the instructions for making proteins.", "ex": ""}, {"topic": "dna", "term": "DNA replication", "def": "DNA copies itself before a cell divides. Each new strand is built using complementary base pairing.", "ex": ""}, {"topic": "inh", "term": "Trait", "def": "A feature or characteristic of an organism.", "ex": "Eye colour, beak colour, height."}, {"topic": "inh", "term": "Heritable trait", "def": "A trait controlled by genes and passed from parents to offspring.", "ex": "Blood group, eye colour."}, {"topic": "inh", "term": "Non-heritable (acquired) trait", "def": "A trait gained during life from the environment. It is not in the DNA, so it is not passed on.", "ex": "A scar, big muscles, a suntan."}, {"topic": "inh", "term": "Genotype", "def": "The combination of alleles an organism has for a trait.", "ex": "BB, Bb or bb."}, {"topic": "inh", "term": "Phenotype", "def": "The physical expression of the genotype: what you can see or measure. Can be influenced by the environment.", "ex": "Brown eyes."}, {"topic": "inh", "term": "Dominant allele", "def": "An allele that is always expressed when it is present. Written as a capital letter.", "ex": "B"}, {"topic": "inh", "term": "Recessive allele", "def": "An allele that is only expressed when there is no dominant allele. Written as a lower-case letter.", "ex": "Only shows in bb."}, {"topic": "inh", "term": "Homozygous", "def": "Having two identical alleles for a gene.", "ex": "BB or bb."}, {"topic": "inh", "term": "Heterozygous", "def": "Having two different alleles for a gene.", "ex": "Bb"}, {"topic": "inh", "term": "Carrier", "def": "A heterozygous individual who carries a recessive allele but does not show the recessive trait.", "ex": "Dd for Wilson’s disease."}, {"topic": "inh", "term": "Punnett square", "def": "A grid used to predict the possible genotypes and phenotypes of offspring from a cross.", "ex": ""}, {"topic": "inh", "term": "Monohybrid cross", "def": "A cross that follows the inheritance of one gene (one trait).", "ex": ""}, {"topic": "inh", "term": "Ratio from Bb × Bb", "def": "Genotypes 1 BB : 2 Bb : 1 bb. Phenotypes 3 dominant : 1 recessive.", "ex": "25% chance of bb."}, {"topic": "inh", "term": "Continuous variation", "def": "A range of phenotypes between two extremes, with in-betweens. Caused by genes and the environment.", "ex": "Height, body mass."}, {"topic": "inh", "term": "Discontinuous variation", "def": "A few distinct phenotypes with no in-betweens. Usually caused by genes only.", "ex": "ABO blood group."}, {"topic": "rep", "term": "Mitosis", "def": "Cell division that makes two identical diploid cells, for growth and repair.", "ex": ""}, {"topic": "rep", "term": "Meiosis", "def": "Cell division that makes four genetically different haploid gametes.", "ex": ""}, {"topic": "rep", "term": "Gamete", "def": "A sex cell: an egg or a sperm. It is haploid.", "ex": ""}, {"topic": "rep", "term": "Somatic cell", "def": "Any body cell that is not a gamete. It is diploid and made by mitosis.", "ex": "Skin cell."}, {"topic": "rep", "term": "Haploid", "def": "A cell with one set of chromosomes.", "ex": "Human gametes: 23."}, {"topic": "rep", "term": "Diploid", "def": "A cell with two sets of chromosomes, one set from each parent.", "ex": "Human body cells: 46."}, {"topic": "rep", "term": "Homologous chromosomes", "def": "A matching pair of chromosomes, one from each parent, carrying the same genes.", "ex": ""}, {"topic": "rep", "term": "Fertilisation", "def": "The fusion of an egg and a sperm (two haploid gametes) to form a diploid zygote.", "ex": ""}, {"topic": "rep", "term": "Zygote", "def": "The first cell of a new organism, formed at fertilisation. It is diploid.", "ex": ""}, {"topic": "rep", "term": "Sexual reproduction", "def": "Two parents each contribute genetic material (gametes), so the offspring has a new combination of alleles from both.", "ex": ""}, {"topic": "rep", "term": "Asexual reproduction", "def": "One parent produces offspring that are genetically identical (clones). Fast, but no variation.", "ex": "Aphids in summer."}, {"topic": "rep", "term": "Crossing over", "def": "During meiosis, homologous chromosomes swap sections of DNA, creating new combinations of alleles.", "ex": ""}, {"topic": "rep", "term": "Independent assortment", "def": "During meiosis, chromosome pairs line up and separate randomly, so each gamete gets a different mix.", "ex": ""}, {"topic": "rep", "term": "Random fertilisation", "def": "Any sperm can fertilise any egg, so every offspring gets a unique combination of alleles.", "ex": ""}, {"topic": "pop", "term": "Genetic variation", "def": "The differences in DNA (alleles) between individuals in a population.", "ex": ""}, {"topic": "pop", "term": "Mutation", "def": "A random change in the DNA base sequence. It can create a new allele.", "ex": "Often an error in DNA replication."}, {"topic": "pop", "term": "Mutagen", "def": "Something that increases the rate of mutation.", "ex": "UV light, X-rays, some chemicals."}, {"topic": "pop", "term": "Gametic vs somatic mutation", "def": "Gametic mutation (egg or sperm): CAN be passed on. Somatic mutation (body cell): CANNOT be passed on.", "ex": ""}, {"topic": "pop", "term": "Natural selection", "def": "Individuals with useful traits are more likely to survive and reproduce, so their alleles become more common.", "ex": ""}, {"topic": "pop", "term": "Selection pressure", "def": "A factor in the environment that affects which individuals survive.", "ex": "Disease, predators, drought."}, {"topic": "pop", "term": "Adaptation", "def": "An inherited feature that helps an organism survive and reproduce in its environment.", "ex": ""}, {"topic": "pop", "term": "Gene pool", "def": "All the alleles in a population.", "ex": ""}, {"topic": "pop", "term": "Allele frequency", "def": "How common an allele is in a population’s gene pool.", "ex": ""}, {"topic": "pop", "term": "Migration (gene flow)", "def": "Individuals moving into or out of a population, adding or removing alleles.", "ex": ""}, {"topic": "pop", "term": "Non-random mating", "def": "Individuals choose mates with particular traits, which changes allele frequencies.", "ex": "Sexual or artificial selection."}, {"topic": "pop", "term": "Small population size", "def": "Few individuals means few alleles. Alleles can be lost by chance and inbreeding is more likely.", "ex": "Kākāpō, tara-iti."}, {"topic": "pop", "term": "Inbreeding", "def": "Breeding between closely related individuals. Offspring are more likely to get two copies of a harmful recessive allele.", "ex": ""}, {"topic": "trk", "term": "Gene tracking", "def": "Following a specific gene or allele through generations, or between individuals and populations.", "ex": ""}, {"topic": "trk", "term": "DNA sequencing", "def": "Working out the exact order of bases (A, T, C, G) in a DNA molecule.", "ex": ""}, {"topic": "trk", "term": "Genetic marker", "def": "A known DNA sequence that varies between individuals. Used to show relatedness or track a trait.", "ex": ""}, {"topic": "trk", "term": "DNA profiling", "def": "Comparing DNA sequences to identify individuals or see how closely related they are.", "ex": "Forensics, paternity tests."}, {"topic": "trk", "term": "Pedigree chart", "def": "A family tree that tracks how a trait is passed down through generations.", "ex": "Square = male, circle = female, shaded = has the trait."}, {"topic": "trk", "term": "Phylogenetic tree", "def": "A branching diagram showing how closely related species or groups are.", "ex": ""}]};
const TOPIC = Object.fromEntries(DATA.topics.map(t => [t.id, t.name]));
DATA.cards.forEach((c, i) => c.id = i);
let mode = "flip";
let active = new Set(DATA.topics.map(t => t.id));
const panel = document.getElementById("panel");
const store = { get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
                set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
const esc = s => s.replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pool = () => DATA.cards.filter(c => active.has(c.topic));
const tc = t => `var(--${t})`;

// topic chips
const tbox = document.getElementById("topics");
DATA.topics.forEach(t => {
  const b = document.createElement("button");
  b.className = "chip"; b.id = "chip-" + t.id; b.style.setProperty("--tc", tc(t.id));
  b.textContent = t.name; b.setAttribute("aria-pressed", "true");
  b.onclick = () => {
    if (active.has(t.id) && active.size === 1) return;
    active.has(t.id) ? active.delete(t.id) : active.add(t.id);
    b.setAttribute("aria-pressed", active.has(t.id));
    start();
  };
  tbox.appendChild(b);
});
document.querySelectorAll("nav.modes button").forEach(b => b.onclick = () => {
  mode = b.dataset.mode;
  document.querySelectorAll("nav.modes button").forEach(x => x.setAttribute("aria-selected", x === b));
  start();
});

// ---------- FLASH CARDS ----------
let deck = [], total = 0, reverse = false;
function startFlip(){ deck = shuffle(pool()); total = deck.length; renderFlip(); }
function renderFlip(){
  if (!deck.length){
    panel.innerHTML = `<div class="done-box"><span class="stat">All ${total} cards learnt</span>
      <p class="muted">Every card is marked “Got it”. Try the Quiz to test yourself.</p>
      <div class="row"><button class="btn primary" id="again-all">Go again</button><button class="btn" id="to-quiz">Start the quiz</button></div></div>`;
    document.getElementById("again-all").onclick = startFlip;
    document.getElementById("to-quiz").onclick = () => document.getElementById("tab-quiz").click();
    return;
  }
  const c = deck[0];
  const front = reverse
    ? `<div class="def"><span>${esc(c.def)}</span></div><div class="hint">Which term is this? Tap to check</div>`
    : `<div class="big">${esc(c.term)}</div><div class="hint">Say the definition out loud, then tap to flip</div>`;
  const back = reverse
    ? `<div class="big">${esc(c.term)}</div>${c.ex ? `<div class="ex" style="text-align:center">${esc(c.ex)}</div>` : ""}`
    : `<div class="def"><span>${esc(c.def)}</span>${c.ex ? `<span class="ex">${esc(c.ex)}</span>` : ""}</div>`;
  const done = total - deck.length;
  panel.innerHTML = `
    <div class="row"><span class="muted"><b>${deck.length}</b> to go · ${done} learnt</span>
      <label class="muted"><input type="checkbox" id="rev" ${reverse ? "checked" : ""}> Show definition first</label></div>
    <div class="progress" aria-hidden="true"><i style="width:${total ? done/total*100 : 0}%"></i></div>
    <button class="flipcard" id="card" style="--tc:${tc(c.topic)}" aria-label="Flash card. Press to flip.">
      <div class="flipinner">
        <div class="face"><span class="tag" style="--tc:${tc(c.topic)}">${TOPIC[c.topic]}</span>${front}</div>
        <div class="face back"><span class="tag" style="--tc:${tc(c.topic)}">${TOPIC[c.topic]}</span>${back}</div>
      </div>
    </button>
    <div class="row">
      <button class="btn bad" id="again">↺ Again</button>
      <button class="btn" id="shuffle">Shuffle</button>
      <button class="btn good" id="got">✓ Got it</button>
    </div>`;
  const card = document.getElementById("card");
  card.onclick = () => card.classList.toggle("on");
  document.getElementById("rev").onchange = e => { reverse = e.target.checked; renderFlip(); };
  document.getElementById("again").onclick = () => { deck.push(deck.shift()); renderFlip(); };
  document.getElementById("got").onclick = () => { deck.shift(); renderFlip(); };
  document.getElementById("shuffle").onclick = () => { deck = shuffle(deck); renderFlip(); };
}

// ---------- QUIZ ----------
const QN = 10;
let qs = [], qi = 0, results = [];
const COLS = ["var(--A)", "var(--T)", "var(--C)", "var(--G)"];
function startQuiz(){
  const p = pool();
  qs = shuffle(p).slice(0, Math.min(QN, p.length)).map(c => {
    const same = shuffle(p.filter(x => x.id !== c.id && x.topic === c.topic));
    const other = shuffle(DATA.cards.filter(x => x.id !== c.id && x.topic !== c.topic));
    const wrong = same.concat(other).slice(0, 3);
    return { c, opts: shuffle([c, ...wrong]) };
  });
  qi = 0; results = []; renderQuiz();
}
function strand(){
  return `<div class="strand" aria-label="${results.filter(Boolean).length} correct">` + qs.map((_, i) => {
    if (i >= results.length) return `<span></span>`;
    return results[i] ? `<span class="ok" style="background:${COLS[i%4]}">${"ATCG"[i%4]}</span>` : `<span class="no">✕</span>`;
  }).join("") + `</div>`;
}
function renderQuiz(){
  if (qi >= qs.length){
    const score = results.filter(Boolean).length;
    const missed = qs.filter((q, i) => !results[i]);
    const best = Math.max(store.get("gp-best-quiz", 0), score); store.set("gp-best-quiz", best);
    panel.innerHTML = `<div class="done-box">
      <span class="stat">${score} / ${qs.length}</span>${strand()}
      <p class="muted">Best score on this device: ${best} / ${QN}</p>
      ${missed.length ? `<p><b>Revise these:</b></p><ul class="missed">${missed.map(q => `<li style="--tc:${tc(q.c.topic)}"><b>${esc(q.c.term)}</b>: ${esc(q.c.def)}</li>`).join("")}</ul>` : `<p><b>Perfect round.</b> Try a different topic.</p>`}
      <button class="btn primary" id="retry">New quiz</button></div>`;
    document.getElementById("retry").onclick = startQuiz;
    return;
  }
  const q = qs[qi];
  panel.innerHTML = `
    <div class="row"><span class="muted">Question <b>${qi+1}</b> of ${qs.length}</span>${strand()}</div>
    <span class="tag" style="--tc:${tc(q.c.topic)}">${TOPIC[q.c.topic]} · which term matches?</span>
    <p class="qdef">${esc(q.c.def)}</p>
    <div class="options">${q.opts.map((o, i) => `<button class="opt" id="opt-${i}" data-id="${o.id}">${esc(o.term)}</button>`).join("")}</div>
    <div class="row"><span class="feedback" id="fb" aria-live="polite"></span><button class="btn primary" id="next" hidden>Next →</button></div>`;
  panel.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const ok = +b.dataset.id === q.c.id;
    results.push(ok);
    panel.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.id === q.c.id) x.classList.add("right"); });
    if (!ok) b.classList.add("wrong");
    const fb = document.getElementById("fb");
    fb.className = "feedback " + (ok ? "good" : "bad");
    fb.textContent = ok ? "Correct!" : `Not quite. It’s “${q.c.term}”.`;
    const nx = document.getElementById("next"); nx.hidden = false; nx.focus();
    nx.onclick = () => { qi++; renderQuiz(); };
  });
}

// ---------- MATCH ----------
const MN = 6;
let mset = [], mdefs = [], selTerm = null, matched = 0, t0 = 0, timer = null, mistakes = 0;
function startMatch(){
  clearInterval(timer);
  mset = shuffle(pool()).slice(0, Math.min(MN, pool().length));
  mdefs = shuffle(mset); selTerm = null; matched = 0; mistakes = 0; t0 = 0;
  renderMatch();
}
function fmt(ms){ const s = Math.floor(ms/1000); return Math.floor(s/60) + ":" + String(s%60).padStart(2, "0"); }
function renderMatch(){
  panel.innerHTML = `
    <div class="row"><span class="muted">Tap a term, then its definition</span>
      <span><span class="stat" id="clock">0:00</span> <span class="muted" id="mstat">${matched}/${mset.length}</span></span></div>
    <div class="mgrid">
      <div class="mcol">${mset.map(c => `<button class="tile term" id="mt-${c.id}" data-id="${c.id}" style="--tc:${tc(c.topic)}">${esc(c.term)}</button>`).join("")}</div>
      <div class="mcol">${mdefs.map(c => `<button class="tile def" id="md-${c.id}" data-id="${c.id}" style="--tc:${tc(c.topic)}">${esc(c.def)}</button>`).join("")}</div>
    </div>
    <div class="row"><span class="muted" id="best"></span><button class="btn" id="mnew">New set</button></div>`;
  const best = store.get("gp-best-match", null);
  document.getElementById("best").textContent = best ? "Best time on this device: " + fmt(best) : "";
  document.getElementById("mnew").onclick = startMatch;
  const tick = () => { const el = document.getElementById("clock"); if (el && t0) el.textContent = fmt(Date.now() - t0); };
  panel.querySelectorAll(".tile.term").forEach(b => b.onclick = () => {
    if (b.classList.contains("done")) return;
    if (!t0){ t0 = Date.now(); timer = setInterval(tick, 250); }
    panel.querySelectorAll(".tile.term").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel"); selTerm = +b.dataset.id;
  });
  panel.querySelectorAll(".tile.def").forEach(b => b.onclick = () => {
    if (b.classList.contains("done") || selTerm === null) return;
    const t = document.getElementById("mt-" + selTerm);
    if (+b.dataset.id === selTerm){
      t.classList.remove("sel"); t.classList.add("done"); b.classList.add("done");
      t.disabled = true; b.disabled = true; selTerm = null; matched++;
      document.getElementById("mstat").textContent = matched + "/" + mset.length;
      if (matched === mset.length){
        clearInterval(timer); const ms = Date.now() - t0;
        const prev = store.get("gp-best-match", null);
        if (!prev || ms < prev) store.set("gp-best-match", ms);
        panel.insertAdjacentHTML("afterbegin", `<div class="done-box"><span class="stat">All matched in ${fmt(ms)}</span><p class="muted">${mistakes} wrong tries${!prev || ms < prev ? " · new best on this device" : ""}</p></div>`);
      }
    } else {
      mistakes++; b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
    }
  });
}

function start(){ clearInterval(timer); if (mode === "flip") startFlip(); else if (mode === "quiz") startQuiz(); else startMatch(); }
start();
</script>

</body></html>
